# mesa-servicio corre con el rol mesa_servicio_app (sin permisos de dueño ni de UPDATE/DELETE en auditoria).
# Los secretos llegan como archivos (ADR-005): /run/secrets en contenedor, o la carpeta de CENTINELA_SECRETOS.
spring:
  application:
    name: mesa-servicio
  config:
    import: optional:configtree:${CENTINELA_SECRETOS:/run/secrets}/
  datasource:
    url: jdbc:postgresql://${CENTINELA_BD_HOST:127.0.0.1}:${CENTINELA_BD_PUERTO:5432}/${CENTINELA_BD_NOMBRE:centinela}
    username: mesa_servicio_app
    password: ${mesa_servicio_app_db_password}
  # A14: la app nunca migra. Las migraciones corren aparte, con el perfil "migracion" y el rol dueño.
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        # asignadoA → asignado_a. Explícito: no depender del valor por defecto de cada versión.
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        default_schema: mesa_servicio
  # Solo publica (vía outbox). Confirmaciones del broker y mandatory: un evento se da por publicado solo si
  # RabbitMQ lo aceptó y llegó a una cola.
  rabbitmq:
    host: ${CENTINELA_MQ_HOST:127.0.0.1}
    port: ${CENTINELA_MQ_PUERTO:5672}
    virtual-host: centinela
    username: mesa_servicio
    password: ${rabbitmq_mesa_servicio_password:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    deserialization:
      # A6: un campo que la acción no acepta (por ejemplo "prioridad" al crear) es un 400, no se ignora.
      fail-on-unknown-properties: true

server:
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

centinela:
  sla:
    # Tiempo hábil de resolución por prioridad.
    resolucion:
      P1: PT4H
      P2: PT8H
      P3: PT24H
      P4: PT72H
    umbral-alerta: 0.75
    revision: PT1M
    jornada:
      zona: America/Costa_Rica
      inicio: "08:00"
      fin: "17:00"
      dias: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
      feriados: []
  tickets:
    # A5: tickets que una misma persona puede crear por hora (además del rate limiting por IP de nginx).
    max-por-hora: 20
  mensajeria:
    relevo: PT2S
    lote: 50
    # Con backoff 2 s, 4 s… hasta 5 min, 50 intentos son unas 3,5 horas sin broker antes de rendirse y alertar.
    max-intentos: 50
    espera-confirmacion: PT5S
    max-espera: PT5M
  usuarios-prueba:
    password: ${usuarios_prueba_password:}
    usuarios: []
