# En cada push y pull request: busca secretos en todo el historial y verifica el agente.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Sin secretos en el historial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binario oficial con versión fija y checksum verificado. No se usa gitleaks-action porque en el
      # primer push de una rama intenta escanear desde el padre del primer commit y falla sin escanear.
      - name: Instalar gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}
          curl -sSfLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Escanear todo el historial
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  agente:
    name: Agente (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: services/agente/global.json
      - name: Formato
        run: dotnet format --verify-no-changes
      - name: Pruebas (sin modelo real, sin gastar tokens)
        run: dotnet test
      - name: Paquetes vulnerables
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerables.txt
          ! grep -q "has the following vulnerable packages" vulnerables.txt

  mesa-servicio:
    name: mesa-servicio (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mesa-servicio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Incluye las pruebas con PostgreSQL real (Testcontainers): el runner trae Docker.
      - name: Pruebas
        run: ./mvnw -B verify

  generador:
    name: generador (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/generador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Pruebas
        run: ./mvnw -B verify
