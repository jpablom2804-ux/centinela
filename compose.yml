# Entorno de desarrollo, fase 0: solo infraestructura. Cada servicio se agrega en su fase.
# Los puertos se publican solo en 127.0.0.1: nada queda expuesto a la red local.
# Compatible con Podman (Rocky Linux): imágenes con nombre completo y montajes con etiqueta SELinux.
# Secretos (ADR-005): llegan como archivos en /run/secrets, nunca como variables de entorno.
# Antes del primer `up`: ./scripts/secretos.sh generar   (o `descifrar` si ya existen cifrados)
name: centinela

services:
  postgres:
    # PostgreSQL 18 con la extensión pgvector ya instalada (búsqueda por significado).
    image: docker.io/pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    # Solo los secretos que necesita el script de init; ningún otro servicio recibe estos.
    secrets:
      - postgres_admin_password
      - mesa_servicio_db_password
      - mesa_servicio_app_db_password
      - agente_db_password
      - powerbi_ro_db_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Desde PostgreSQL 18 el volumen se monta en /var/lib/postgresql (no en .../data).
      - postgres-datos:/var/lib/postgresql
      # z: etiqueta SELinux para que el contenedor pueda leer la carpeta en Rocky; Docker sin SELinux la ignora.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      # Por TCP: durante el script de init solo escucha por socket, así que no da "sano" antes de tiempo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  rabbitmq:
    image: docker.io/library/rabbitmq:4-management
    # Nombre de nodo fijo: sin esto, recrear el contenedor cambia el nodo y se pierden las colas del volumen.
    hostname: rabbitmq
    # Usuario, contraseña y vhost por defecto, en un archivo de configuración montado como secreto.
    secrets:
      - source: rabbitmq_conf
        target: /etc/rabbitmq/conf.d/20-centinela.conf
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-datos:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  mesa_servicio_db_password:
    file: ./secrets/mesa_servicio_db_password
  mesa_servicio_app_db_password:
    file: ./secrets/mesa_servicio_app_db_password
  agente_db_password:
    file: ./secrets/agente_db_password
  powerbi_ro_db_password:
    file: ./secrets/powerbi_ro_db_password
  rabbitmq_conf:
    file: ./secrets/rabbitmq.conf

volumes:
  postgres-datos:
  rabbitmq-datos:
