# Usuarios, permisos, exchanges, colas y DLQ salen de un solo archivo de definiciones (A3).
# Lo genera ./scripts/secretos.sh a partir de deploy/rabbitmq/definiciones.plantilla.json, porque lleva
# los hashes de las contraseñas. Al importar definiciones no se crea el usuario "guest".
load_definitions = /etc/rabbitmq/definiciones.json
